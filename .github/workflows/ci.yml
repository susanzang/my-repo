name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: 单元测试
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: 运行单元测试（含覆盖率门禁）
        run: npm run test:coverage

      - name: 汇总结果
        if: always()
        run: echo "本次 CI 结果：${{ job.status }}"
